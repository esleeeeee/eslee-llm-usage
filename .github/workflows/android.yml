name: Android verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          # The action defaults to "tools platform-tools", and the legacy "tools"
          # package has been withdrawn from the SDK repository, which fails setup.
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Import signing key
        if: github.event_name != 'pull_request'
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "SIGNING_KEYSTORE_BASE64 secret is required for device APKs"
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Test, lint, build
        env:
          SIGNING_STORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.SIGNING_STORE_PASSWORD || '' }}
          SIGNING_KEY_ALIAS: ${{ github.event_name != 'pull_request' && secrets.SIGNING_KEY_ALIAS || '' }}
          SIGNING_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.SIGNING_KEY_PASSWORD || '' }}
        run: bash ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease assembleDebugAndroidTest
      - name: Retain signed APK for live-session verification
        if: github.event_name != 'pull_request'
        # Keep the signed APK separately available for in-place live-session QA.
        # The full reports artifact also contains the much larger debug APK.
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-apk
          path: app/build/outputs/apk/release/app-release.apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify account journeys, session deletion, and widget refresh
        uses: reactivecircus/android-emulator-runner@v2
        env:
          SIGNING_STORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.SIGNING_STORE_PASSWORD || '' }}
          SIGNING_KEY_ALIAS: ${{ github.event_name != 'pull_request' && secrets.SIGNING_KEY_ALIAS || '' }}
          SIGNING_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.SIGNING_KEY_PASSWORD || '' }}
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell settings put secure show_ime_with_hard_keyboard 1
            bash ./scripts/verify-connected.sh
      - name: Record verified source and APK hashes
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          files = pathlib.Path('app/build/outputs/apk').rglob('*.apk')
          evidence = {'source_sha': os.environ['GITHUB_SHA'], 'run_id': os.environ['GITHUB_RUN_ID'],
                      'checks': ['testDebugUnitTest', 'lintDebug', 'assembleDebug', 'assembleRelease', 'Android instrumentation'],
                      'sha256': {str(p): hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(files)}}
          pathlib.Path('verification-manifest.json').write_text(json.dumps(evidence, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-results
          path: |
            app/build/outputs/apk/
            app/build/reports/
            app/build/test-results/
            app/build/outputs/androidTest-results/
            verification-manifest.json
      - name: Publish versioned APKs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python3 - <<'PY'
          import re, pathlib
          text = pathlib.Path("app/build.gradle.kts").read_text()
          match = re.search(r'versionName\s*=\s*"([^"]+)"', text)
          if not match:
              raise SystemExit("versionName not found")
          print(match.group(1))
          PY
          )
          TAG="v$VERSION"
          # Only the release APK is published: the debug build is debuggable, so an
          # attached ADB can read the provider session cookies this app stores, it
          # carries the Demo sample provider, and it is ~13x larger.
          cp app/build/outputs/apk/release/app-release.apk "eslee-llm-usage-${TAG}.apk"
          cp verification-manifest.json "eslee-llm-usage-${TAG}-verification.json"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Increment versionName/versionCode instead of replacing published binaries."
            exit 1
          else
            gh release create "$TAG" "eslee-llm-usage-${TAG}.apk" "eslee-llm-usage-${TAG}-verification.json" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "eslee LLM Usage $TAG" \
              --notes "Build $TAG. Signed release APK for Android 9 (API 28) and later. Device and live-provider verification are recorded in BUILD_REPORT.md."
          fi
