name: Android verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Test, lint, build
        run: bash ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-results
          path: |
            app/build/outputs/apk/
            app/build/reports/
            app/build/test-results/
      - name: Publish v0.1.0 debug APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk eslee-llm-usage-v0.1.0-debug.apk
          if gh release view v0.1.0 >/dev/null 2>&1; then
            gh release upload v0.1.0 eslee-llm-usage-v0.1.0-debug.apk --clobber
          else
            gh release create v0.1.0 eslee-llm-usage-v0.1.0-debug.apk \
              --target "$GITHUB_SHA" \
              --title "eslee LLM Usage v0.1.0" \
              --notes "First device-test build. Debug APK for Android 9 (API 28) and later. Consumer-provider live login and real-device widget behavior are still under verification."
          fi
